{% extends 'cashier_workspace.html' %}
{% block content %}
{{ super() }}
<style>
.cashier-suborder-entry{display:inline-flex;align-items:center;gap:7px}.cashier-suborder-entry .cashier-suborder-dot{width:8px;height:8px;border-radius:50%;background:currentColor}.cashier-selected-suborder-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:inherit;border:1px solid #cfe1d8;background:#f2faf6;border-radius:13px;padding:11px 12px;margin:10px 0}.cashier-selected-suborder-cta:hover{border-color:var(--brand);background:var(--brand-soft)}.cashier-selected-suborder-cta strong,.cashier-selected-suborder-cta small{display:block}.cashier-selected-suborder-cta strong{font-size:.79rem}.cashier-selected-suborder-cta small{font-size:.67rem;color:var(--muted);margin-top:2px}.cashier-selected-suborder-plus{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:1.15rem;font-weight:900;flex:0 0 auto}.cashier-order-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;border-top:1px solid #edf2ef}.cashier-order-row>.cashier-order-link{border-top:0;min-width:0}.cashier-order-direct-suborder{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-width:92px;padding:8px 10px;text-decoration:none;border-left:1px solid #e2ebe6;color:var(--brand);background:#fbfdfc;font-size:.61rem;font-weight:850;line-height:1.15;text-align:center}.cashier-order-direct-suborder strong{font-size:1.15rem;line-height:1}.cashier-order-direct-suborder:hover{background:var(--brand-soft);color:var(--brand)}@media(max-width:760px){.cashier-suborder-entry{min-height:44px;justify-content:center}.cashier-mobile-bar{grid-template-columns:repeat(5,1fr)!important}.cashier-order-direct-suborder{min-width:76px;min-height:54px;padding:7px 6px;font-size:.58rem}}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const queueUrl = {{ url_for('suborders_web.cashier_queue', bar_id=bar.id)|tojson }};
  const head = document.querySelector('.cashier-head-actions');
  if (head && !head.querySelector('[data-cashier-suborders]')) {
    const link = document.createElement('a');
    link.href = queueUrl;
    link.className = 'btn btn-outline-primary cashier-suborder-entry';
    link.dataset.cashierSuborders = '1';
    link.innerHTML = '<span class="cashier-suborder-dot"></span><span>Sous-commandes</span>';
    head.insertBefore(link, head.children[1] || null);
  }

  const mobile = document.querySelector('.cashier-mobile-bar');
  if (mobile && !mobile.querySelector('[data-cashier-suborders-mobile]')) {
    const link = document.createElement('a');
    link.href = queueUrl;
    link.dataset.cashierSubordersMobile = '1';
    link.innerHTML = '＋<br>Sous-cmd';
    mobile.insertBefore(link, mobile.children[2] || null);
  }

  const activeSuborderUrls = {
    {% for order in waiting_orders + payable_orders %}
      {% if order.assigned_staff_id %}
      "{{ order.id }}": {{ url_for('suborders_web.new_suborder', bar_id=bar.id, order_id=order.id)|tojson }},
      {% endif %}
    {% endfor %}
  };

  document.querySelectorAll('.cashier-order-link').forEach(link => {
    const orderId = new URL(link.href, window.location.origin).searchParams.get('order_id');
    const addUrl = activeSuborderUrls[orderId];
    if (!addUrl || link.closest('.cashier-order-row')) return;
    const row = document.createElement('div');
    row.className = 'cashier-order-row';
    link.parentNode.insertBefore(row, link);
    row.appendChild(link);

    const add = document.createElement('a');
    add.href = addUrl;
    add.className = 'cashier-order-direct-suborder';
    add.dataset.cashierAddSuborder = '1';
    add.setAttribute('aria-label', 'Ajouter une sous-commande à cette commande');
    add.innerHTML = '<strong>＋</strong><span>Sous-commande</span>';
    row.appendChild(add);
  });

  {% if selected_order and selected_server_assignment and selected_order.payment_status != 'PAID' %}
  const addUrl = {{ url_for('suborders_web.new_suborder', bar_id=bar.id, order_id=selected_order.id)|tojson }};
  const paymentPanel = document.getElementById('paymentPanel');
  const summary = paymentPanel?.querySelector('.cashier-order-summary');
  if (paymentPanel && summary && !paymentPanel.querySelector('[data-selected-suborder-add]')) {
    const cta = document.createElement('a');
    cta.href = addUrl;
    cta.className = 'cashier-selected-suborder-cta';
    cta.dataset.selectedSuborderAdd = '1';
    cta.innerHTML = '<div><strong>Ajouter une sous-commande</strong><small>Servir un ajout maintenant sur cette facture, sans fusionner les lignes.</small></div><span class="cashier-selected-suborder-plus">＋</span>';
    summary.insertAdjacentElement('beforebegin', cta);
  }
  {% endif %}
});
</script>
{% endblock %}
