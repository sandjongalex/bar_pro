{% extends 'cashier_workspace.html' %}
{% block content %}
{{ super() }}
<style>
.cashier-suborder-entry,.cashier-invoices-entry{display:inline-flex;align-items:center;gap:7px}.cashier-suborder-entry .cashier-suborder-dot{width:8px;height:8px;border-radius:50%;background:currentColor}.cashier-selected-suborder-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:inherit;border:1px solid #cfe1d8;background:#f2faf6;border-radius:13px;padding:11px 12px;margin:10px 0}.cashier-selected-suborder-cta:hover{border-color:var(--brand);background:var(--brand-soft)}.cashier-selected-suborder-cta strong,.cashier-selected-suborder-cta small{display:block}.cashier-selected-suborder-cta strong{font-size:.79rem}.cashier-selected-suborder-cta small{font-size:.67rem;color:var(--muted);margin-top:2px}.cashier-selected-suborder-plus{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:1.15rem;font-weight:900;flex:0 0 auto}.cashier-order-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;border-top:1px solid #edf2ef}.cashier-order-row>.cashier-order-link{border-top:0;min-width:0}.cashier-order-row-actions{display:flex;flex-direction:column;width:96px;border-left:1px solid #e2ebe6;background:#fbfdfc}.cashier-order-direct-detail,.cashier-order-direct-suborder{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:42px;padding:7px 8px;text-decoration:none;color:var(--brand);font-size:.61rem;font-weight:850;line-height:1.15;text-align:center}.cashier-order-direct-detail{color:inherit;background:#fff}.cashier-order-direct-suborder{border-top:1px solid #e2ebe6}.cashier-order-direct-suborder strong{font-size:1.05rem;line-height:1}.cashier-order-direct-detail:hover,.cashier-order-direct-suborder:hover{background:var(--brand-soft);color:var(--brand)}.cashier-human-order-title{text-transform:uppercase;letter-spacing:.02em}.cashier-human-tech-ref{display:block!important;font-size:.54rem!important;color:var(--muted)!important;opacity:.78;margin-top:2px!important}.cashier-selected-system-ref{display:block;margin-top:3px;font-size:.58rem;color:var(--muted);font-weight:650}@media(max-width:760px){.cashier-suborder-entry,.cashier-invoices-entry{min-height:44px;justify-content:center}.cashier-mobile-bar{grid-template-columns:repeat(5,1fr)!important}.cashier-order-row-actions{width:82px}.cashier-order-direct-detail,.cashier-order-direct-suborder{min-height:44px;padding:6px 5px;font-size:.57rem}}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const queueUrl = {{ url_for('suborders_web.cashier_queue', bar_id=bar.id)|tojson }};
  const invoicesUrl = {{ url_for('cashier_invoices_web.invoices', bar_id=bar.id)|tojson }};
  const head = document.querySelector('.cashier-head-actions');

  if (head && !head.querySelector('[data-cashier-invoices]')) {
    const invoices = document.createElement('a');
    invoices.href = invoicesUrl;
    invoices.className = 'btn btn-outline-primary cashier-invoices-entry';
    invoices.dataset.cashierInvoices = '1';
    invoices.innerHTML = '<span>▤</span><span>Factures</span>';
    head.insertBefore(invoices, head.children[1] || null);
  }

  if (head && !head.querySelector('[data-cashier-suborders]')) {
    const link = document.createElement('a');
    link.href = queueUrl;
    link.className = 'btn btn-outline-primary cashier-suborder-entry';
    link.dataset.cashierSuborders = '1';
    link.innerHTML = '<span class="cashier-suborder-dot"></span><span>Sous-commandes</span>';
    head.insertBefore(link, head.children[2] || null);
  }

  const mobile = document.querySelector('.cashier-mobile-bar');
  const legacyQueue = mobile?.querySelector('a[href="#queue"]');
  if (legacyQueue) {
    legacyQueue.href = invoicesUrl;
    legacyQueue.dataset.cashierInvoicesMobile = '1';
    legacyQueue.innerHTML = '▤<br>Factures';
  }
  if (mobile && !mobile.querySelector('[data-cashier-suborders-mobile]')) {
    const link = document.createElement('a');
    link.href = queueUrl;
    link.dataset.cashierSubordersMobile = '1';
    link.innerHTML = '＋<br>Sous-cmd';
    mobile.insertBefore(link, mobile.children[2] || null);
  }

  const activeSuborderUrls = {
    {% for order in waiting_orders + payable_orders %}
      {% if order.assigned_staff_id %}
      "{{ order.id }}": {{ url_for('suborders_web.new_suborder', bar_id=bar.id, order_id=order.id)|tojson }},
      {% endif %}
    {% endfor %}
  };
  const detailUrls = {
    {% for order in waiting_orders + payable_orders %}
      "{{ order.id }}": {{ url_for('orders_web.detail', bar_id=bar.id, order_id=order.id)|tojson }},
    {% endfor %}
  };

  document.querySelectorAll('.cashier-order-link').forEach(link => {
    const orderId = new URL(link.href, window.location.origin).searchParams.get('order_id');
    const detailUrl = detailUrls[orderId];
    const addUrl = activeSuborderUrls[orderId];
    if (!detailUrl || link.closest('.cashier-order-row')) return;

    const copy = link.querySelector('.cashier-order-copy');
    const title = copy?.querySelector('strong');
    const meta = copy?.querySelector('small');
    if (copy && title && meta) {
      const systemReference = title.textContent.trim();
      const parts = meta.textContent.split(' · ').map(value => value.trim()).filter(Boolean);
      const serverName = parts[0] || 'Caisse / comptoir';
      const rawTable = parts[1] || 'Sans table';
      const productSummary = parts.slice(2).join(' · ');
      const humanTitle = rawTable !== 'Sans table' ? rawTable : 'COMPTOIR';
      title.textContent = humanTitle;
      title.classList.add('cashier-human-order-title');
      meta.textContent = productSummary ? `${serverName} · ${productSummary}` : serverName;
      const techRef = document.createElement('small');
      techRef.className = 'cashier-human-tech-ref';
      techRef.textContent = `Réf. système : ${systemReference}`;
      copy.appendChild(techRef);
    }

    const row = document.createElement('div');
    row.className = 'cashier-order-row';
    link.parentNode.insertBefore(row, link);
    row.appendChild(link);

    const actions = document.createElement('div');
    actions.className = 'cashier-order-row-actions';
    row.appendChild(actions);

    const detail = document.createElement('a');
    detail.href = detailUrl;
    detail.className = 'cashier-order-direct-detail';
    detail.dataset.cashierOrderDetail = '1';
    detail.setAttribute('aria-label', 'Voir les détails de cette commande');
    detail.innerHTML = '<span>◉</span><span>Détails</span>';
    actions.appendChild(detail);

    if (addUrl) {
      const add = document.createElement('a');
      add.href = addUrl;
      add.className = 'cashier-order-direct-suborder';
      add.dataset.cashierAddSuborder = '1';
      add.setAttribute('aria-label', 'Ajouter une sous-commande à cette commande');
      add.innerHTML = '<strong>＋</strong><span>Sous-commande</span>';
      actions.appendChild(add);
    }
  });

  {% if selected_order %}
  const selectedHeading = document.querySelector('#paymentPanel .cashier-pay-title h2');
  if (selectedHeading) {
    selectedHeading.textContent = {{ (selected_order.table_label_snapshot or 'COMPTOIR')|tojson }};
    selectedHeading.classList.add('cashier-human-order-title');
    const technicalReference = document.createElement('small');
    technicalReference.className = 'cashier-selected-system-ref';
    technicalReference.textContent = 'Réf. système : ' + {{ selected_order.reference|tojson }};
    selectedHeading.insertAdjacentElement('afterend', technicalReference);
  }
  {% endif %}

  {% if selected_order and selected_server_assignment and selected_order.payment_status != 'PAID' %}
  const addUrl = {{ url_for('suborders_web.new_suborder', bar_id=bar.id, order_id=selected_order.id)|tojson }};
  const paymentPanel = document.getElementById('paymentPanel');
  const summary = paymentPanel?.querySelector('.cashier-order-summary');
  if (paymentPanel && summary && !paymentPanel.querySelector('[data-selected-suborder-add]')) {
    const cta = document.createElement('a');
    cta.href = addUrl;
    cta.className = 'cashier-selected-suborder-cta';
    cta.dataset.selectedSuborderAdd = '1';
    cta.innerHTML = '<div><strong>Ajouter une sous-commande</strong><small>Servir un ajout maintenant sur cette facture, sans fusionner les lignes.</small></div><span class="cashier-selected-suborder-plus">＋</span>';
    summary.insertAdjacentElement('beforebegin', cta);
  }
  {% endif %}
});
</script>
{% endblock %}
