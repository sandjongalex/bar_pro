<div class="cashier-order-actions" data-order-actions="{{ order.id }}">
  <a class="btn btn-sm btn-light border" href="{{ url_for('orders_web.detail', bar_id=bar_id, order_id=order.id) }}">Détails / aperçu</a>
  {% if order.status == 'DRAFT' %}
  <form method="post" action="{{ url_for('cashier_workspace_web.workspace', bar_id=bar_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="deliver">
    <input type="hidden" name="order_id" value="{{ order.id }}">
    <button class="btn btn-sm btn-primary" type="submit">Livrée</button>
  </form>
  {% else %}
  <a class="btn btn-sm btn-primary" href="{{ url_for('cashier_workspace_web.workspace', bar_id=bar_id, order_id=order.id, focus='payment') }}#paymentPanel">Payer</a>
  <a class="btn btn-sm btn-outline-primary" href="{{ url_for('checkout_web.receipt', bar_id=bar_id, order_id=order.id) }}" target="_blank" rel="noopener">Imprimer</a>
  {% endif %}
  {% if order.assigned_staff_id %}
  <a class="btn btn-sm btn-light border" data-cashier-add-suborder href="{{ url_for('suborders_web.new_suborder', bar_id=bar_id, order_id=order.id) }}">＋ Sous-commande</a>
  {% endif %}
</div>
