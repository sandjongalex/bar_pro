<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bar Manager Pro{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<a class="skip-link" href="#main">Aller au contenu</a>
<div class="d-lg-flex min-vh-100">
  <aside class="sidebar bg-dark text-white p-3 d-none d-lg-block" aria-label="Navigation principale">
    <a class="navbar-brand text-white fw-bold d-block mb-4" href="{{ url_for('web.dashboard') }}">Bar Manager Pro</a>
    <nav class="nav flex-column gap-1">
      <a class="nav-link text-white {% if request.endpoint == 'web.dashboard' %}active{% endif %}" href="{{ url_for('web.dashboard') }}">Tableau de bord</a>
      <a class="nav-link text-white" href="{{ url_for('bars.web_list') }}">Établissements</a>
    </nav>
  </aside>
  <div class="flex-grow-1">
    <header class="navbar bg-white border-bottom px-3 py-2">
      <span class="fw-semibold">{% block header %}Tableau de bord{% endblock %}</span>
      <div class="d-flex align-items-center gap-2"><span class="small text-muted">{{ current_user.display_name }}</span><form method="post" action="{{ url_for('auth.web_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-outline-secondary btn-sm">Déconnexion</button></form></div>
    </header>
    <nav class="d-lg-none navbar bg-dark px-3" aria-label="Navigation mobile"><a class="navbar-brand text-white" href="{{ url_for('web.dashboard') }}">Accueil</a><a class="text-white" href="{{ url_for('bars.web_list') }}">Établissements</a></nav>
    <main id="main" class="container-fluid p-3 p-md-4">{% block content %}{% endblock %}</main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
