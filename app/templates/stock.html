{% extends 'layout.html' %}{% block content %}<h1 class="h3">Historique de stock</h1><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Variation</th><th>Motif</th></tr></thead><tbody>{% for row in rows.items %}<tr><td>{{ row.occurred_at }}</td><td>{{ row.movement_type }}</td><td>{{ row.quantity_delta }}</td><td>{{ row.reason }}</td></tr>{% else %}<tr><td colspan="4" class="text-muted">Aucun mouvement.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
