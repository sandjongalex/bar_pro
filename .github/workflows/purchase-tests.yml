name: Purchase workflow tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-only-environment-value
      TEST_DATABASE_URI: 'sqlite+pysqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run purchase enhancements
        run: pytest -q tests/test_purchase_enhancements.py
      - name: Run existing purchase and supplier workflows
        run: pytest -q tests/test_workflows.py -k 'purchase or supplier'
      - name: Validate schema table count
        run: pytest -q tests/test_schema.py::test_initial_migration_creates_every_model_table
      - name: Validate migrated metadata equality
        run: pytest -q tests/test_schema.py::test_migrated_columns_constraints_and_metadata_match
      - name: Validate Flask DB upgrade and routes
        run: pytest -q tests/test_schema.py::test_flask_cli_upgrade_and_routes_on_empty_database
      - name: Validate generated data model document
        run: pytest -q tests/test_schema.py::test_data_model_document_matches_models
      - name: Validate MySQL migration SQL
        run: pytest -q tests/test_schema.py::test_mysql_migration_sql_compiles_without_blob_keys
      - name: Validate remaining schema regressions
        run: pytest -q tests/test_schema.py -k 'not initial_migration_creates_every_model_table and not migrated_columns_constraints_and_metadata_match and not flask_cli_upgrade_and_routes_on_empty_database and not data_model_document_matches_models and not mysql_migration_sql_compiles_without_blob_keys'
