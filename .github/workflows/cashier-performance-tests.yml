name: Cashier performance tests

on:
  push:
    paths:
      - 'app/cashier_performance.py'
      - 'app/__init__.py'
      - 'app/templates/cashier_workspace_v2.html'
      - 'tests/test_cashier_performance.py'
      - '.github/workflows/cashier-performance-tests.yml'
  pull_request:
    paths:
      - 'app/cashier_performance.py'
      - 'app/__init__.py'
      - 'app/templates/cashier_workspace_v2.html'
      - 'tests/test_cashier_performance.py'
      - '.github/workflows/cashier-performance-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_cashier_performance.py
      - run: pytest -q tests/test_cashier_workspace.py
