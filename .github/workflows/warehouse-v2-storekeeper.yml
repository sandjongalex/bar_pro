name: Warehouse V2 storekeeper RBAC

on:
  push:
    branches:
      - feature/warehouse-v2-storekeeper
  pull_request:
    branches:
      - feature/warehouse-v2-foundation
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sqlite-roles-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate complete schema dictionary
        run: python scripts/schema_document.py
      - name: Role and previous foundation tests
        env:
          SECRET_KEY: warehouse-v2-role-ci-only
        run: |
          python -m pytest -q tests/test_warehouse_v2_storekeeper.py tests/test_warehouse_v2_foundation.py -k 'not mysql'
          python -m pytest -q tests/test_schema.py tests/test_employee_tenant_auth.py tests/test_saas_v1_foundation.py
      - name: Complete regression suite
        env:
          SECRET_KEY: warehouse-v2-role-ci-only
        run: python -m pytest -q
      - name: Publish generated schema dictionary on feature push only
        if: always() && github.event_name == 'push' && github.ref_name == 'feature/warehouse-v2-storekeeper'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DATA_MODEL.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(schema): include storekeeper role grants [skip ci]"
            git push origin HEAD:refs/heads/feature/warehouse-v2-storekeeper
          fi

  mysql-role-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: warehouse-storekeeper-ci-only
          MYSQL_DATABASE: barpro_storekeeper_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwarehouse-storekeeper-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run MySQL 8 real Alembic migrations and role checks
        env:
          SECRET_KEY: warehouse-v2-role-ci-only
          WAREHOUSE_MYSQL_TEST_URI: mysql+pymysql://root:warehouse-storekeeper-ci-only@127.0.0.1:3306/barpro_storekeeper_ci?charset=utf8mb4
        run: |
          python -m pytest -q tests/test_warehouse_v2_foundation.py -k mysql
          python -m pytest -q tests/test_warehouse_v2_storekeeper.py -k mysql
