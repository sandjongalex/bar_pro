name: Cashier personnel filter tests

on:
  push:
    paths:
      - 'app/cashier_invoices_web.py'
      - 'app/templates/cashier_invoices.html'
      - 'app/templates/cashier_invoices_v2.html'
      - 'tests/test_cashier_invoices_ui.py'
      - '.github/workflows/cashier-personnel-filter-tests.yml'
  pull_request:
    paths:
      - 'app/cashier_invoices_web.py'
      - 'app/templates/cashier_invoices.html'
      - 'app/templates/cashier_invoices_v2.html'
      - 'tests/test_cashier_invoices_ui.py'
      - '.github/workflows/cashier-personnel-filter-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_cashier_invoices_ui.py
