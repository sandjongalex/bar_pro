name: Unpaid delivery CSRF and stock integrity

on:
  push:
    branches: [fix/unpaid-delivery-csrf-refresh, main]
    paths:
      - 'app/errors.py'
      - 'app/unpaid_orders_web.py'
      - 'app/static/unpaid_orders_ui.js'
      - 'tests/test_unpaid_delivery_csrf.py'
      - 'tests/async_invoice_unpaid_ui.test.cjs'
      - '.github/workflows/unpaid-delivery-csrf.yml'
  pull_request:
    paths:
      - 'app/errors.py'
      - 'app/unpaid_orders_web.py'
      - 'app/static/unpaid_orders_ui.js'
      - 'tests/test_unpaid_delivery_csrf.py'
      - 'tests/async_invoice_unpaid_ui.test.cjs'
      - '.github/workflows/unpaid-delivery-csrf.yml'

jobs:
  delivery-csrf-and-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app/errors.py app/unpaid_orders_web.py
      - run: node --check app/static/unpaid_orders_ui.js
      - run: node --test tests/async_invoice_unpaid_ui.test.cjs tests/barpro_async.test.cjs
      - run: >-
          python -m pytest -q
          tests/test_unpaid_delivery_csrf.py
          tests/test_cashier_delivery_confirmation.py
          tests/test_unpaid_orders_web.py
          tests/test_async_invoices_unpaid.py
          tests/test_async_suborders.py
          tests/test_employee_tenant_auth.py
  all-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
