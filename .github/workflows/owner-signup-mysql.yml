name: BAR_PRO Owner Signup - MySQL

on:
  push:
    branches:
      - feature/owner-self-registration
  pull_request:
    paths:
      - "app/**"
      - "tests/test_owner_registration_mysql.py"
      - "migrations/**"
      - ".github/workflows/owner-signup-mysql.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new commit replaces any still-running obsolete validation on this branch.
concurrency:
  group: owner-signup-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signup-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: barpro_test
          MYSQL_USER: barpro_ci
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      OWNER_SIGNUP_MYSQL_TEST_URI: mysql+pymysql://barpro_ci:ci_test_password@127.0.0.1:3306/barpro_test
      OWNER_SIGNUP_MYSQL_TEST_CONFIRM: ISOLATED_MYSQL_TEST
      SECRET_KEY: only-for-automated-tests-use-unique-production-secrets

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier les imports et règles de l'essai
        run: python -c "from app import create_app; from app.saas_governance import trial_expired; print('Imports OK')"
      - name: Tester l'inscription et les 15 jours sur MySQL
        run: python -m pytest -v tests/test_owner_registration_mysql.py
      - name: Vérification complémentaire du parcours propriétaire
        if: always()
        run: python -m pytest -v tests/test_owner_registration.py
