name: Product catalog CRUD tests

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'app/catalog.py'
      - 'app/catalog_services.py'
      - 'app/product_images.py'
      - 'app/static/catalog.css'
      - 'app/static/product_images_ui.js'
      - 'app/templates/catalog.html'
      - 'app/templates/layout.html'
      - 'tests/test_product_crud_images.py'
      - 'tests/test_catalog_responsive.py'
      - 'tests/test_pos_product_images.py'
      - '.github/workflows/product-catalog-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run product CRUD, image and responsive tests
        run: python -m pytest tests/test_product_crud_images.py tests/test_catalog_responsive.py tests/test_pos_product_images.py -q
