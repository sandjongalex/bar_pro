name: Order detail actions tests

on:
  pull_request:
    paths:
      - 'app/templates/order_detail.html'
      - 'app/static/order_edit.css'
      - 'tests/test_order_detail_actions.py'
      - '.github/workflows/order-detail-actions-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run order detail state and delivered-edit flow
        run: python -m pytest tests/test_order_detail_actions.py -q
