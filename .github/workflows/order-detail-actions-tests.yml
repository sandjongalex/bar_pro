name: Order detail actions tests

on:
  pull_request:
    paths:
      - 'app/templates/order_detail.html'
      - 'app/order_edit_service.py'
      - 'app/order_edit_web.py'
      - 'app/static/order_edit_ui.js'
      - 'tests/test_order_detail_actions.py'
      - 'tests/test_order_edit_roles.py'
      - 'tests/test_order_edit_web.py'
      - '.github/workflows/order-detail-actions-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run order detail and delivered-edit tests
        run: python -m pytest tests/test_order_detail_actions.py tests/test_order_edit_roles.py tests/test_order_edit_web.py -q
