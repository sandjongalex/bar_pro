name: Warehouse V2 MAIN to CASHIER transfers

on:
  push:
    branches:
      - feature/warehouse-v2-transfers
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Transfer lifecycle and previous warehouse regressions
        env:
          SECRET_KEY: transfers-ci-only
        run: |
          python -m pytest -q tests/test_warehouse_v2_transfers.py tests/test_warehouse_v2_foundation.py tests/test_warehouse_v2_storekeeper.py
          python -m pytest -q tests/test_alembic_a9b0_recovery.py
      - name: Metadata migration parity and existing purchase tests
        env:
          SECRET_KEY: transfers-ci-only
        run: |
          python -m pytest -q tests/test_schema.py::test_migrated_columns_constraints_and_metadata_match tests/test_schema.py::test_flask_cli_upgrade_and_routes_on_empty_database
          python -m pytest -q tests/test_warehouse_v2_purchases.py

  mysql-transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: transfers-ci-only
          MYSQL_DATABASE: barpro_warehouse_transfers_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptransfers-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Production upgrade and transfer accounting on MySQL 8
        env:
          SECRET_KEY: transfers-ci-only
          WAREHOUSE_MYSQL_TEST_URI: mysql+pymysql://root:transfers-ci-only@127.0.0.1:3306/barpro_warehouse_transfers_ci?charset=utf8mb4
        run: python -m pytest -q tests/test_warehouse_v2_transfers_mysql.py
