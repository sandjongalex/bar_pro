name: Dashboard KPI charts tests
on:
  push:
    paths: ['app/templates/dashboard.html','app/static/dashboard_kpi_charts.js','app/static/dashboard_kpi_charts.css','tests/test_dashboard_kpi_charts.py','.github/workflows/dashboard-kpi-tests.yml']
  pull_request:
    paths: ['app/templates/dashboard.html','app/static/dashboard_kpi_charts.js','app/static/dashboard_kpi_charts.css','tests/test_dashboard_kpi_charts.py','.github/workflows/dashboard-kpi-tests.yml']
jobs:
  kpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_dashboard_kpi_charts.py tests/test_dashboard_reset_button.py
