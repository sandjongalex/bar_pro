name: Inventory V2 mobile visual check

on:
  push:
    branches:
      - feature/inventory-v2-hardening-responsive
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-viewports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium
      - name: Test inventory screens on phone, tablet and desktop
        env:
          SECRET_KEY: ci-only-visual-test-secret
        run: python -m pytest tests/test_inventory_v2_visual_browser.py -q -vv
