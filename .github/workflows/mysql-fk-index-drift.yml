name: MySQL implicit FK indexes versus Alembic schema check

on:
  push:
    branches:
      - fix/mysql-autogenerated-fk-index-drift
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: SQLite Alembic schema check unchanged
        env:
          SECRET_KEY: mysql-fk-index-test-only
        run: |
          python -m pytest -q tests/test_schema.py::test_migrated_columns_constraints_and_metadata_match tests/test_schema.py::test_flask_cli_upgrade_and_routes_on_empty_database tests/test_alembic_a9b0_recovery.py

  mysql-fk-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql-fk-index-test-only
          MYSQL_DATABASE: barpro_mysql_fk_index_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmysql-fk-index-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Upgrade from applied a9b0 and check MySQL FK indexes
        env:
          SECRET_KEY: mysql-fk-index-test-only
          WAREHOUSE_MYSQL_TEST_URI: mysql+pymysql://root:mysql-fk-index-test-only@127.0.0.1:3306/barpro_mysql_fk_index_ci?charset=utf8mb4
        run: python -m pytest -q tests/test_warehouse_v2_purchases_mysql.py
