name: Warehouse V2 supplier purchases to MAIN

on:
  push:
    branches:
      - feature/warehouse-v2-purchases
  pull_request:
    branches:
      - feature/warehouse-v2-storekeeper
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-purchases-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate schema dictionary
        run: python scripts/schema_document.py
      - name: MAIN receipt, correction, RBAC and previous warehouse foundation tests
        env:
          SECRET_KEY: warehouse-v2-purchases-ci-only
        run: |
          python -m pytest -q tests/test_warehouse_v2_purchases.py tests/test_purchase_enhancements.py tests/test_purchase_web_edit.py
          python -m pytest -q tests/test_warehouse_v2_foundation.py tests/test_warehouse_v2_storekeeper.py tests/test_schema.py -k 'not mysql'
      - name: Full regression suite (including sales and supplier payments)
        env:
          SECRET_KEY: warehouse-v2-purchases-ci-only
        run: python -m pytest -q

  mysql-purchases-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: warehouse-purchases-ci-only
          MYSQL_DATABASE: barpro_warehouse_purchase_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwarehouse-purchases-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply MySQL 8 Alembic migrations against existing purchase data
        env:
          SECRET_KEY: warehouse-v2-purchases-ci-only
          WAREHOUSE_MYSQL_TEST_URI: mysql+pymysql://root:warehouse-purchases-ci-only@127.0.0.1:3306/barpro_warehouse_purchase_ci?charset=utf8mb4
        run: python -m pytest -q tests/test_warehouse_v2_purchases_mysql.py
