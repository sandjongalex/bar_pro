name: Inventory V2 real MySQL concurrency

on:
  push:
    branches:
      - feature/inventory-v2-mysql-concurrency
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-concurrency:
    name: Two-session InnoDB stock and approval races
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: inventory-ephemeral-ci-only
          MYSQL_DATABASE: barpro_inventory_concurrency_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pinventory-ephemeral-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app and pytest
        run: python -m pip install -r requirements.txt
      - name: Run current production-equivalent Alembic migrations against disposable MySQL
        env:
          SECRET_KEY: ci-only-inventory-concurrency-secret
          FLASK_CONFIG: development
          SQLALCHEMY_DATABASE_URI: mysql+pymysql://root:inventory-ephemeral-ci-only@127.0.0.1:3306/barpro_inventory_concurrency_ci?charset=utf8mb4
        run: |
          python -m flask --app wsgi:application db upgrade
          python -m flask --app wsgi:application db current
          # MySQL adds implicit FK indexes that Alembic autogenerate sees as
          # spurious "remove_index" operations. Check exact Alembic head and
          # required live stock tables instead; do not mutate production.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          config = Config()
          config.set_main_option("script_location", "migrations")
          head = ScriptDirectory.from_config(config).get_current_head()
          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          with engine.connect() as conn:
              actual = conn.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              assert actual == head, (actual, head)
              required = {"stock_balances", "stock_movements", "inventories",
                          "inventory_approvals", "inventory_cashier_assignments"}
              assert required <= set(inspect(conn).get_table_names())
              print("PASS: current Alembic head and V2 stock tables:", head)
          PY
      - name: Exercise parallel order confirmation and inventory approval
        env:
          CI: "true"
          SECRET_KEY: ci-only-inventory-concurrency-secret
          BAR_PRO_MYSQL_CONCURRENCY_TEST: "1"
          BAR_PRO_MYSQL_CONCURRENCY_URI: mysql+pymysql://root:inventory-ephemeral-ci-only@127.0.0.1:3306/barpro_inventory_concurrency_ci?charset=utf8mb4
        run: |
          python -m pytest -q -vv tests/test_inventory_v2_mysql_concurrency.py
