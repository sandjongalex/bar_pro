name: SaaS V1 foundations — migration and regression
on:
  push:
    branches: [feature/saas-v1-foundation]
  pull_request:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/**'
      - 'docs/saas_v1/**'
      - 'scripts/schema_document.py'
      - '.github/workflows/saas-v1-foundation.yml'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Compile and generate physical schema dictionary
        run: |
          python -m compileall -q app tests
          python scripts/schema_document.py
      - name: Synchronize deterministic schema doc to this feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/saas-v1-foundation'
        run: |
          if ! git diff --quiet -- docs/DATA_MODEL.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/DATA_MODEL.md
            git commit -m "docs(schema): regenerate dictionary after SaaS governance migration"
            git push origin HEAD:feature/saas-v1-foundation
          fi
      - name: Targeted SaaS tenant and authorization tests
        run: python -m pytest -q tests/test_saas_v1_foundation.py tests/test_employee_tenant_auth.py tests/test_owner_multibar_tenant_regression.py tests/test_schema.py tests/test_cashier_suborder_edit.py
      - name: Frontend regressions
        run: |
          node --check app/static/barpro_async.js
          node --test tests/*.test.cjs
      - name: Entire Python regression suite (no hidden failures)
        run: python -m pytest -q

  mysql-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
          MYSQL_DATABASE: barpro_saas_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Upgrade populated legacy MySQL schema without data loss (never production)
        env:
          SECRET_KEY: ephemeral-ci-key-do-not-use-in-prod
          SQLALCHEMY_DATABASE_URI: mysql+pymysql://root:ephemeral-ci-only@127.0.0.1:3306/barpro_saas_ci?charset=utf8mb4
          FLASK_CONFIG: development
        run: |
          # Build the exact previous migration head, seed a real legacy owner/bar,
          # and verify the additive SaaS migration never rewrites these rows.
          python -m flask --app wsgi:application db upgrade d1e2f3a4b5c6
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          with engine.begin() as conn:
              conn.execute(text("""
                  INSERT INTO users (email, display_name, password_hash, category,
                                     is_active, credentials_version, created_at, updated_at)
                  VALUES ('ci-legacy-owner@example.invalid', 'Existing Owner',
                          'not-a-real-password', 'OWNER', 1, 1, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6))
              """))
              owner_id = conn.execute(text(
                  "SELECT id FROM users WHERE email='ci-legacy-owner@example.invalid'"
              )).scalar_one()
              conn.execute(text("""
                  INSERT INTO bars (owner_id, name, status, timezone, currency,
                                    stock_alert_threshold, credit_sales_enabled, created_at, updated_at)
                  VALUES (:id, 'Existing legacy bar', 'ACTIVE', 'Africa/Douala', 'XAF',
                          0, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6))
              """), {"id": owner_id})
          PY
          python -m flask --app wsgi:application db upgrade
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          import os
          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          with engine.connect() as conn:
              assert conn.execute(text("SELECT version_num FROM alembic_version")).scalar() == "ba5a5a1f0001"
              names = set(inspect(conn).get_table_names())
              assert {"bar_governance", "owner_governance", "orders", "subscriptions"} <= names
              assert conn.execute(text("SELECT COUNT(*) FROM bar_governance")).scalar() == 0
              assert conn.execute(text("SELECT COUNT(*) FROM owner_governance")).scalar() == 0
              assert conn.execute(text("""
                  SELECT COUNT(*) FROM bars JOIN users ON users.id = bars.owner_id
                  WHERE users.email='ci-legacy-owner@example.invalid'
                  AND bars.name='Existing legacy bar' AND bars.status='ACTIVE'
              """)).scalar() == 1
          PY

      - name: SaaS governance smoke with real ephemeral MySQL transactions
        env:
          SECRET_KEY: ephemeral-ci-key-do-not-use-in-prod
          SQLALCHEMY_DATABASE_URI: mysql+pymysql://root:ephemeral-ci-only@127.0.0.1:3306/barpro_saas_ci?charset=utf8mb4
          FLASK_CONFIG: development
        run: |
          python - <<'PY'
          from sqlalchemy import select, func
          from wsgi import application
          from app.extensions import db
          from app.models import Bar, User, AuditLog
          from app.permissions import permissions
          from app.saas_governance import change_bar_governance, change_owner_governance, suspension_level
          from app.saas_governance_models import BarGovernance, OwnerGovernance

          with application.app_context():
              admin = User(email="ci-admin@example.invalid", display_name="CI Admin", category="SUPER_ADMIN")
              owner = User(email="ci-owner@example.invalid", display_name="CI Owner", category="OWNER")
              outsider = User(email="ci-foreign@example.invalid", display_name="Foreign Owner", category="OWNER")
              for user in (admin, owner, outsider):
                  user.set_password("ci-password-only")
              db.session.add_all((admin, owner, outsider))
              db.session.flush()
              first = Bar(owner_id=owner.id, name="CI First Bar", timezone="Africa/Douala", currency="XAF")
              second = Bar(owner_id=outsider.id, name="CI Foreign Bar", timezone="Africa/Douala", currency="XAF")
              db.session.add_all((first, second))
              db.session.commit()

              assert permissions.evaluate(owner, "orders.read", first.id).allowed
              assert not permissions.evaluate(owner, "orders.read", second.id).allowed
              assert not permissions.evaluate(admin, "payments.record", first.id).allowed
              assert not permissions.evaluate(admin, "shifts.manage", first.id).allowed

              change_bar_governance(admin, first.id, status="SUSPENDED", suspension_level=1, reason="MySQL CI read-only")
              db.session.commit()
              assert permissions.evaluate(owner, "orders.read", first.id).allowed
              assert not permissions.evaluate(owner, "orders.create", first.id).allowed
              assert permissions.evaluate(outsider, "orders.create", second.id).allowed

              change_bar_governance(admin, first.id, status="SUSPENDED", suspension_level=2, reason="MySQL CI locked")
              db.session.commit()
              db.session.expire_all()
              assert suspension_level(first.id) == 2
              assert not permissions.evaluate(owner, "orders.read", first.id).allowed
              assert permissions.evaluate(owner, "bars.support.read", first.id).allowed
              assert db.session.get(BarGovernance, first.id).status == "SUSPENDED"

              change_owner_governance(admin, owner.id, status="SUSPENDED", reason="CI owner suspension")
              db.session.commit()
              assert not permissions.evaluate(owner, "bars.support.read", first.id).allowed
              assert db.session.get(OwnerGovernance, owner.id).status == "SUSPENDED"
              assert db.session.get(Bar, first.id).status == "ACTIVE"
              assert db.session.get(Bar, second.id).status == "ACTIVE"
              assert db.session.scalar(select(func.count()).select_from(AuditLog).where(
                  AuditLog.action == "bars.governance.change", AuditLog.bar_id == first.id)) == 2
              db.session.rollback()
          PY
