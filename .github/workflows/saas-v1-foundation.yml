name: SaaS V1 foundations — migration and regression
on:
  push:
    branches: [feature/saas-v1-foundation]
  pull_request:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/**'
      - 'docs/saas_v1/**'
      - 'scripts/schema_document.py'
      - '.github/workflows/saas-v1-foundation.yml'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Compile and generate physical schema dictionary
        run: |
          python -m compileall -q app tests
          python scripts/schema_document.py
      - name: Synchronize deterministic schema doc to this feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/saas-v1-foundation'
        run: |
          if ! git diff --quiet -- docs/DATA_MODEL.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/DATA_MODEL.md
            git commit -m "docs(schema): regenerate dictionary after SaaS governance migration"
            git push origin HEAD:feature/saas-v1-foundation
          fi
      - name: Targeted SaaS tenant and authorization tests
        run: python -m pytest -q tests/test_saas_v1_foundation.py tests/test_employee_tenant_auth.py tests/test_owner_multibar_tenant_regression.py tests/test_schema.py
      - name: Frontend regressions
        run: |
          node --check app/static/barpro_async.js
          node --test tests/*.test.cjs
      - name: Entire Python regression suite (no hidden failures)
        run: python -m pytest -q
